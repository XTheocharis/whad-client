name: Lint

on:
  push:
    branches:
      - main
      - clue
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - clue
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8 mypy
      - name: Run flake8
        run: flake8 whad/
      - name: Run mypy
        run: mypy whad/ || true
